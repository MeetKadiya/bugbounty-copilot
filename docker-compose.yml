services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugbounty-copilot-backend
    ports:
      - "8000:8000"
    # Loaded only if the file exists -- a fresh clone has no backend/.env yet
    # (it's gitignored on purpose) and the app already ships safe defaults for
    # every setting, so startup must never depend on this file being present.
    # `docker compose up --build` from a bare clone works with zero manual
    # setup; run setup.sh / setup.ps1 (or copy backend/.env.example yourself)
    # only when you want to override a default, e.g. to add an
    # ANTHROPIC_API_KEY.
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bugbounty-copilot-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  backend_data:
  backend_logs:
